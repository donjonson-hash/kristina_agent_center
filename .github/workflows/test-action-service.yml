name: Test Action Service

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn httpx websockets
    
    - name: Check Python syntax
      run: python -m py_compile action_service.py
    
    - name: Start service
      run: |
        python action_service.py &
        sleep 5
    
    - name: Test health endpoint
      run: curl -f http://localhost:8000/api/actions/health
    
    - name: Test execute endpoint
      run: |
        curl -X POST http://localhost:8000/api/actions/execute \
          -H "Content-Type: application/json" \
          -d '{"action":"test","target":"Test","agent_id":"devops","params":{},"requires_approval":false}'
    
    - name: Stop service
      run: kill %1 || true
