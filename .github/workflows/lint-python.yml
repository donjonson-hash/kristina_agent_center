name: Lint Python

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install linters
      run: pip install flake8 bandit
    
    - name: Run flake8
      continue-on-error: true
      run: flake8 action_service.py decision_gate.py --max-line-length=120 --ignore=E501,W503,E302
    
    - name: Run bandit (security)
      continue-on-error: true
      run: bandit action_service.py decision_gate.py -ll -s B311
