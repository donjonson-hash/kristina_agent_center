name: Validate Ontology

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ontology.yaml'
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    
    - name: Install yaml validator
      run: pip install pyyaml
    
    - name: Check ontology.yaml
      run: |
        python -c "
        import yaml
        try:
            with open('ontology.yaml', 'r') as f:
                data = yaml.safe_load(f)
                print('✅ Ontology is valid YAML')
                if data and 'ontology' in data:
                    entities = data['ontology'].get('entities', [])
                    print(f'📊 Entities: {len(entities)}')
                else:
                    print('⚠️ No ontology key found')
        except FileNotFoundError:
            print('⚠️ ontology.yaml not found - skipping')
            exit(0)
        except Exception as e:
            print(f'❌ Error: {e}')
            exit(1)
        "
      continue-on-error: true
