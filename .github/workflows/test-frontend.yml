name: Test Frontend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './app/package-lock.json'
    
    - name: Install dependencies
      working-directory: ./app
      run: npm ci || npm install
    
    - name: Type check
      working-directory: ./app
      run: |
        npx tsc --noEmit || echo "TypeScript errors found"
    
    - name: Lint
      working-directory: ./app
      run: |
        npx eslint . --ext .ts,.tsx --max-warnings=0 || echo "Linting issues found"
    
    - name: Build
      working-directory: ./app
      run: npm run build || echo "Build failed"
